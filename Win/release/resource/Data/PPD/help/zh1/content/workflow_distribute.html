假设到这里谱面已经完成。接下来制作要发布的数据。<br/>
选择 文件→发布。<br/>
<img src="./img/publish1.png" alt=""><br/>
<br/>
会显示以下对话框。勾选想要发布的难度。<br/>
发布文件夹使用默认即可。<br/>
发布文件夹名请输入谱面名（默认会填入工程名，保持原样应该就可以）。<br/>
<img src="./img/publish2.png" alt=""><br/>
<br/>
点击确定后发布完成，并会显示发布文件夹。请将该文件夹压缩为zip文件，上传到上传网站。<br/>
另外，上传之前，请先放入自己PPD的songs文件夹中，确认缩略图和信息等的显示是否正常。<br/>
