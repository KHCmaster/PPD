假設到這裡譜面已經完成。接下來製作要發佈的數據。<br/>
選擇 文件→發佈。<br/>
<img src="./img/publish1.png" alt=""><br/>
<br/>
會顯示以下對話框。勾選想要發佈的難度。<br/>
發佈文件夾使用默認即可。<br/>
發佈文件夾名請輸入譜面名（默認會填入工程名，保持原樣應該就可以）。<br/>
<img src="./img/publish2.png" alt=""><br/>
<br/>
點擊確定後發佈完成，並會顯示發佈文件夾。請將該文件夾壓縮為zip文件，上傳到上傳網站。<br/>
另外，上傳之前，請先放入自己PPD的songs文件夾中，確認縮略圖和信息等的顯示是否正常。<br/>
